<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Widget</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #090d16;
      color: #f1f5f9;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pulse {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
    }
    .refresh-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .refresh-btn:hover {
      background: rgba(59, 130, 246, 0.25);
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 10px;
      padding: 14px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .content-text {
      font-size: 14px;
      line-height: 1.6;
      color: #e2e8f0;
      font-weight: 500;
      word-break: break-word;
    }
    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #64748b;
      border-top: 1px solid #1e293b;
      padding-top: 8px;
    }
    .tag {
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="pulse"></div>
      <span class="title" id="sideDomain">Live Snip</span>
    </div>
    <button id="sideRefreshBtn" class="refresh-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      Refresh
    </button>
  </div>

  <div class="card">
    <div class="card-label">Persistent Selected Content</div>
    <div id="sideContent" class="content-text">Loading content...</div>
  </div>

  <div class="meta-bar">
    <span id="sideUpdated">Updated: --</span>
    <span class="tag">Tab closed? Stays active</span>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
